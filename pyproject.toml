
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repox"
version = "0.1.0"
description = "An open-source repository intelligence platform."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["tree-sitter>=0.23", "tree-sitter-python>=0.23",]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6",]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]